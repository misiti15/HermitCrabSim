name: Advance the crabs

# Once a day, simulate any missing days up to tomorrow (UTC) and commit them,
# so the viewer always has today's day to play live. Safe to re-run.
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: advance-crabs
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Simulate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/advance.js
      - name: Commit new days
        run: |
          git config user.name "crab-sim-bot"
          git config user.email "crab-sim-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Simulate through $(node -e "console.log(require('./docs/data/index.json').lastSimulatedDate)")"
          git push
